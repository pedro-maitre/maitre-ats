version: '3.8'

services:
  db:
    image: postgres:15
    container_name: maitre-ats-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: maitre_ats
    ports:
      - "5432:5432"
    volumes:
      - maitre-ats-data:/var/lib/postgresql/data

volumes:
  maitre-ats-data:
